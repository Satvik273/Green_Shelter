{% extends "base.html" %}

{% block content %}
<div class="blog-page">
    <h1>Our Blog</h1>
    <div class="blog-grid">
        {% for post in posts %}
        <article class="blog-card">
            <div class="blog-image">
                <img src="{{ url_for('static', filename=post.image) }}" alt="{{ post.title }}">
            </div>
            <div class="blog-content">
                <h2>{{ post.title }}</h2>
                <div class="blog-meta">
                    <span><i class="far fa-calendar"></i> {{ post.date_posted.strftime('%B %d, %Y') }}</span>
                </div>
                <p>{{ post.excerpt }}</p>
                <a href="{{ url_for('blog_post', post_id=post.id) }}" class="read-more">Read More</a>
            </div>
        </article>
        {% endfor %}
    </div>
</div>
{% endblock %}
