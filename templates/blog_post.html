{% extends "base.html" %}

{% block content %}
<div class="blog-post">
    <div class="post-header">
        <h1>{{ post.title }}</h1>
        <div class="post-meta">
            <span><i class="far fa-calendar"></i> {{ post.date_posted.strftime('%B %d, %Y') }}</span>
        </div>
    </div>
    <div class="post-image">
        <img src="{{ url_for('static', filename=post.image) }}" alt="{{ post.title }}">
    </div>
    <div class="post-content">
        {{ post.content | safe }}
    </div>
</div>
{% endblock %}
