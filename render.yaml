# This file tells Render how to build and run your application.
# It automates the deployment process, ensuring consistency.

services:
  - type: web
    name: ikstech
    env: python
    plan: free # Or your preferred plan
    region: oregon # Or your preferred region
    branch: main # Or your deployment branch
    buildCommand: |
      pip install -r requirements.txt
      # Apply any pending database migrations before starting the app
      flask db upgrade
      # Generate the static sitemap after the database is ready
      flask generate-sitemap
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ikstech-db # IMPORTANT: Replace with the name of your Render PostgreSQL database
          property: connectionString
      - key: SECRET_KEY
        generateValue: true # Let Render generate a secure secret key
      - key: PYTHON_VERSION
        value: 3.10.12